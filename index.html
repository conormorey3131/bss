<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Business Setup Solutions (Dubai)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                   Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    .background {
      background-image: url('./office.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.8);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }
    h1 {
      font-size: 4em;
      margin: 0;
    }
    footer {
      position: absolute;
      bottom: 20px;
      text-align: center;
      width: 100%;
      color: #fff;
      font-size: 0.9em;
    }
    footer a {
      color: #fff;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="content">
    <h1>Business Setup Solutions</h1>
    <footer>
      <p>&copy; 2025 <a href="https://moreydigital.ie" target="_blank" rel="noopener noreferrer">Morey Digital</a>. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    function toggleMenu() {
      var navLinks = document.getElementById('nav-links');
      var menuIcon = document.querySelector('.menu-icon');
      navLinks.classList.toggle('show');
      var isExpanded = navLinks.classList.contains('show');
      menuIcon.setAttribute('aria-expanded', isExpanded);
    }
  </script>
</body>
</html>
